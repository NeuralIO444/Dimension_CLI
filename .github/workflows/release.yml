name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          grep -q "version = \"$version\"" pyproject.toml
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist
          python -m pip install dist/dimension_cli-*.whl
          dimension --version
          ( cd dist && sha256sum dimension_cli-*.whl > SHA256SUMS )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/dimension_cli-*.whl dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/dimension_cli-*.whl dist/SHA256SUMS \
              --title "Dimension $version" \
              --verify-tag \
              --notes "Install the attached wheel. dimension prints the card. dimension man is local help. --json is the machine face. Exit 0 ok, 1 engine, 2 usage, 65 LUT_UNSCRIPTABLE, 69 AE_UNAVAILABLE."
          fi
