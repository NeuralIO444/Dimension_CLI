name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve tag
        id: tag
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::tag must look like v1.0.0, got $tag"; exit 1 ;;
          esac
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          version="${tag#v}"
          if ! grep -q "version = \"$version\"" pyproject.toml; then
            echo "::error::tag $tag does not match pyproject.toml"
            grep '^version' pyproject.toml
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build wheel
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps -w dist
          python -m pip install dist/dimension_cli-*.whl
          dimension --version
          test -s dist/dimension_cli-*.whl
          ( cd dist && sha256sum dimension_cli-*.whl > SHA256SUMS )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -eu
          notes=$(mktemp)
          cat > "$notes" <<NOTES
Install: \`pip install dimension_cli-${VERSION}-py3-none-any.whl\`

Headless format-conform engine. \`dimension\` prints the card. \`dimension man\` is the local help. \`--json\` is the machine face.

Exit codes: 0 ok, 1 engine, 2 usage, 65 LUT_UNSCRIPTABLE, 69 AE_UNAVAILABLE.

SHA-256 is in the attached SHA256SUMS.
NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading assets"
            gh release upload "$TAG" dist/dimension_cli-*.whl dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/dimension_cli-*.whl dist/SHA256SUMS \
              --title "Dimension $VERSION" \
              --notes-file "$notes" \
              --verify-tag
          fi
