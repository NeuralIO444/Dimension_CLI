name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          pip install build==1.2.2
          python -m build --wheel --outdir dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "version = \"$version\"" pyproject.toml
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --title "Dimension $version" \
            --notes "Install: pip install dist/dimension_cli-${version}-py3-none-any.whl

Headless format-conform engine. \`dimension\` prints the card. \`dimension man\` is the local help. \`--json\` is the machine face.

Exit codes: 0 ok, 1 engine, 2 usage, 65 LUT_UNSCRIPTABLE, 69 AE_UNAVAILABLE."
