# Dimension — Preset bundles.
#
# Higher-level layer on top of config/formats.yaml. Each preset is a
# named bundle of output formats + a tag profile + conform mode/bleed/
# padding + metadata. Consumed by the Preset Manager panel
# (python/ui/preset_manager.py) and — once v5.2 Studio Profiles land —
# by the fleet dispatcher.
#
# Schema per entry:
#   id:         short slug, unique, signal payload.
#   name:       display name ("Hero Launch — Film").
#   group:      coarse bucket ("Studio" | "Social" | "Print" | "Internal").
#   category:   sub-bucket ("Launch" | "Broadcast" | "Streaming" | ...).
#   formats:    list of {label, w, h} — the output targets this preset emits.
#   tags:       list of tag codes (see TAG_DEFS in preset_manager.py).
#   rules:      (int) count of gravity/placement rules. Informational for v1.
#   mode:       "Fit" | "Fill" | "Crop" | "Stretch".
#   bleed:      percentage string ("5.0").
#   padding:    pixels (int).
#   last_used:  display string ("2h ago"). Updated by the runtime.
#   usage:      dispatch counter (int).
#   confidence: live-tagger confidence % (int). v5.2 backend populates;
#               until then it's an author-set hint for how production-ready
#               the preset is.
#   author:     "team/xxx" or "you".
#   status:     "live" | "draft".
#   pinned:     bool — sorted to top regardless of other sort order.

